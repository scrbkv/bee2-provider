name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux / ${{ matrix.compiler }} / ${{ matrix.openssl_tag }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - openssl_tag: openssl-3.0.21
            openssl_commit: 51ea949dc1436e865935b47874b21a3bb31a102e
            compiler: gcc
          - openssl_tag: openssl-3.5.9
            openssl_commit: 45e844fa2a14ec92d146bd8f5778ac130b6625fb
            compiler: gcc
          - openssl_tag: openssl-4.0.3
            openssl_commit: af1775b60dfa141a4ad762585052cabeb9f37e9e
            compiler: clang
          - openssl_tag: openssl-4.1.0
            openssl_commit: 2f4e3a5fec05394068cfa7379890ab552483a8a6
            compiler: gcc
    env:
      CC: ${{ matrix.compiler }}
      OPENSSL_TAG: ${{ matrix.openssl_tag }}
      OPENSSL_COMMIT: ${{ matrix.openssl_commit }}
      OPENSSL_CONF: /dev/null
    steps:
      - name: Check out source and Bee2
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Build pinned OpenSSL
        shell: bash
        run: |
          prefix="${RUNNER_TEMP}/openssl"
          echo "OPENSSL_PREFIX=$prefix" >> "$GITHUB_ENV"
          echo "$prefix/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$prefix/lib" >> "$GITHUB_ENV"
          OPENSSL_PREFIX="$prefix" bash scripts/ci-build-openssl.sh

      - name: Configure provider with public tests
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DBEE2_PROVIDER_BUILD_TESTS=ON \
            -DBEE2_PROVIDER_ENABLE_INTEROP=OFF \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_C_FLAGS="-Wall -Wextra" \
            -DOPENSSL_ROOT_DIR="$OPENSSL_PREFIX" \
            -DOPENSSL_INCLUDE_DIR="$OPENSSL_PREFIX/include" \
            -DOPENSSL_CRYPTO_LIBRARY="$OPENSSL_PREFIX/lib/libcrypto.so" \
            -DOPENSSL_SSL_LIBRARY="$OPENSSL_PREFIX/lib/libssl.so" \
            -DBEE2_OPENSSL_EXECUTABLE="$OPENSSL_PREFIX/bin/openssl"

      - name: Build provider and tests
        run: cmake --build build --parallel 4

      - name: Run tests
        run: ctest --test-dir build --output-on-failure --timeout 120 --output-junit tests.xml

      - name: Check installation and packaging
        shell: bash
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/stage" --component Runtime
          OPENSSL_MODULES="$RUNNER_TEMP/stage/lib/ossl-modules" \
            "$OPENSSL_PREFIX/bin/openssl" list -provider bee2_provider -providers
          cpack --config build/CPackConfig.cmake -B build

      - name: Upload release package and test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-${{ matrix.compiler }}-${{ matrix.openssl_tag }}
          path: |
            build/bee2-provider-*.tar.gz
            build/tests.xml
          if-no-files-found: warn

  sanitizers:
    name: Linux / GCC / ASan + UBSan
    runs-on: ubuntu-24.04
    env:
      CC: gcc
      OPENSSL_TAG: openssl-3.5.9
      OPENSSL_COMMIT: 45e844fa2a14ec92d146bd8f5778ac130b6625fb
      OPENSSL_CONF: /dev/null
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - name: Check out source and Bee2
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Build pinned OpenSSL
        shell: bash
        run: |
          prefix="${RUNNER_TEMP}/openssl"
          echo "OPENSSL_PREFIX=$prefix" >> "$GITHUB_ENV"
          echo "$prefix/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$prefix/lib" >> "$GITHUB_ENV"
          OPENSSL_PREFIX="$prefix" bash scripts/ci-build-openssl.sh

      - name: Configure sanitized build
        shell: bash
        run: |
          cmake -S . -B build-sanitize -DCMAKE_BUILD_TYPE=Debug \
            -DBEE2_PROVIDER_BUILD_TESTS=ON \
            -DBEE2_PROVIDER_ENABLE_INTEROP=OFF \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_MODULE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DOPENSSL_ROOT_DIR="$OPENSSL_PREFIX" \
            -DOPENSSL_INCLUDE_DIR="$OPENSSL_PREFIX/include" \
            -DOPENSSL_CRYPTO_LIBRARY="$OPENSSL_PREFIX/lib/libcrypto.so" \
            -DOPENSSL_SSL_LIBRARY="$OPENSSL_PREFIX/lib/libssl.so" \
            -DBEE2_OPENSSL_EXECUTABLE="$OPENSSL_PREFIX/bin/openssl"

      - name: Build sanitized provider and tests
        run: cmake --build build-sanitize --parallel 4

      - name: Run native C tests with sanitizers
        run: |
          # Keep native selection automatic as the suite grows.
          ctest --test-dir build-sanitize --output-on-failure --timeout 180 \
            -E '^bee2_(bign_options|bign_asn1_negative|bign_codec_roundtrip)$' \
            --output-junit sanitizer-tests.xml

      - name: Upload sanitizer test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sanitizer-tests
          path: build-sanitize/sanitizer-tests.xml
          if-no-files-found: warn

  interoperability:
    name: Linux / bee2evp interoperability
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OPENSSL_CONF: /dev/null
      CC: gcc
      OPENSSL_TAG: openssl-3.5.9
      OPENSSL_COMMIT: 45e844fa2a14ec92d146bd8f5778ac130b6625fb
    steps:
      - name: Check out provider and pinned Bee2
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Build pinned OpenSSL
        shell: bash
        run: |
          prefix="${RUNNER_TEMP}/openssl"
          echo "OPENSSL_PREFIX=$prefix" >> "$GITHUB_ENV"
          echo "$prefix/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$prefix/lib" >> "$GITHUB_ENV"
          OPENSSL_PREFIX="$prefix" bash scripts/ci-build-openssl.sh

      - name: Build pinned legacy OpenSSL for bee2evp
        shell: bash
        run: |
          legacy_prefix="${RUNNER_TEMP}/openssl-bee2evp"
          echo "BEE2EVP_OPENSSL_PREFIX=$legacy_prefix" >> "$GITHUB_ENV"
          OPENSSL_SOURCE_DIR="$RUNNER_TEMP/openssl-bee2evp-src" \
          OPENSSL_PREFIX="$legacy_prefix" \
          OPENSSL_TAG=OpenSSL_1_1_1w \
          OPENSSL_COMMIT=e04bd3433fd84e1861bf258ea37928d9845e6a86 \
            bash scripts/ci-build-openssl.sh
          echo "LD_LIBRARY_PATH=$legacy_prefix/lib:$OPENSSL_PREFIX/lib" >> "$GITHUB_ENV"

      - name: Configure legacy request defaults
        shell: bash
        run: |
          config="$RUNNER_TEMP/bee2evp-openssl.cnf"
          printf '%s\n' '[req]' 'distinguished_name = req_dn' '[req_dn]' 'commonName = Common Name' > "$config"
          echo "BEE2EVP_OPENSSL_CONF=$config" >> "$GITHUB_ENV"

      - name: Build pinned bee2evp engine
        shell: bash
        run: |
          git clone --recursive https://github.com/bcrypto/bee2evp.git "$RUNNER_TEMP/bee2evp"
          git -C "$RUNNER_TEMP/bee2evp" checkout 4768a5cf34c5486716c79a3bd0c6d21375a446e3
          git -C "$RUNNER_TEMP/bee2evp" submodule update --init --recursive
          cmake -S "$RUNNER_TEMP/bee2evp" -B "$RUNNER_TEMP/bee2evp-build" \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DBUILD_DOC=OFF \
            -DBUILD_PIC=ON \
            -DOPENSSL_INCLUDE_DIRS="$BEE2EVP_OPENSSL_PREFIX/include" \
            -DOPENSSL_LIBRARY_DIRS="$BEE2EVP_OPENSSL_PREFIX/lib"
          cmake --build "$RUNNER_TEMP/bee2evp-build" --parallel 4
          engine_library="$(find "$RUNNER_TEMP/bee2evp-build" -name libbee2evp.so -print -quit)"
          test -n "$engine_library"
          engine_dir="$(dirname "$engine_library")"
          ln -sfn libbee2evp.so "$engine_dir/bee2evp.so"
          echo "OPENSSL_ENGINES=$engine_dir" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$engine_dir:$BEE2EVP_OPENSSL_PREFIX/lib:$OPENSSL_PREFIX/lib" >> "$GITHUB_ENV"

      - name: Check engine availability
        run: |
          "$BEE2EVP_OPENSSL_PREFIX/bin/openssl" engine -t -c bee2evp

      - name: Compile legacy EVP cipher interop helper
        shell: bash
        run: |
          tool="$RUNNER_TEMP/bee2evp-cipher-tool"
          "${CC}" -std=c11 -Wall -Wextra -Werror \
            -I"$BEE2EVP_OPENSSL_PREFIX/include" \
            tests/interop_cipher_tool.c \
            -L"$BEE2EVP_OPENSSL_PREFIX/lib" \
            -Wl,-rpath,"$BEE2EVP_OPENSSL_PREFIX/lib" \
            -lcrypto -o "$tool"
          echo "BEE2EVP_LEGACY_TOOL=$tool" >> "$GITHUB_ENV"

      - name: Configure and build interoperability tests
        shell: bash
        run: |
          cmake -S . -B build-interop -DCMAKE_BUILD_TYPE=Release \
            -DBEE2_PROVIDER_BUILD_TESTS=ON \
            -DBEE2_PROVIDER_ENABLE_INTEROP=ON \
            -DBEE2_INTEROP_LEGACY_TOOL="$BEE2EVP_LEGACY_TOOL" \
            -DBEE2_INTEROP_BEE2EVP_ENGINE=bee2evp \
            -DOPENSSL_ROOT_DIR="$OPENSSL_PREFIX" \
            -DOPENSSL_INCLUDE_DIR="$OPENSSL_PREFIX/include" \
            -DOPENSSL_CRYPTO_LIBRARY="$OPENSSL_PREFIX/lib/libcrypto.so" \
            -DOPENSSL_SSL_LIBRARY="$OPENSSL_PREFIX/lib/libssl.so" \
            -DBEE2_OPENSSL_EXECUTABLE="$OPENSSL_PREFIX/bin/openssl" \
            -DBEE2_INTEROP_PROVIDER_OPENSSL="$OPENSSL_PREFIX/bin/openssl" \
            -DBEE2_INTEROP_BEE2EVP_OPENSSL="$BEE2EVP_OPENSSL_PREFIX/bin/openssl" \
            -DBEE2_INTEROP_BEE2EVP_OPENSSL_CONF="$BEE2EVP_OPENSSL_CONF" \
            -DBEE2_INTEROP_BEE2EVP_LD_LIBRARY_PATH="$LD_LIBRARY_PATH"
          cmake --build build-interop --parallel 4

      - name: Run fixed, boundary and random interoperability tests
        run: |
          ctest --test-dir build-interop --output-on-failure --parallel 4 --timeout 240 \
            -R '^(bee2_bee2evp_bign_cert_|bee2_interop_matrix_|bee2_interop_aead_kwp$)' \
            --output-junit interoperability-tests.xml

      - name: Upload interoperability report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: interoperability
          path: build-interop/interoperability-tests.xml
          if-no-files-found: warn

  coverage:
    name: Linux / GCC / provider source coverage
    runs-on: ubuntu-24.04
    env:
      CC: gcc
      OPENSSL_TAG: openssl-3.5.9
      OPENSSL_COMMIT: 45e844fa2a14ec92d146bd8f5778ac130b6625fb
      OPENSSL_CONF: /dev/null
    steps:
      - name: Check out source and Bee2
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Build pinned OpenSSL
        shell: bash
        run: |
          prefix="${RUNNER_TEMP}/openssl"
          echo "OPENSSL_PREFIX=$prefix" >> "$GITHUB_ENV"
          echo "$prefix/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$prefix/lib" >> "$GITHUB_ENV"
          OPENSSL_PREFIX="$prefix" bash scripts/ci-build-openssl.sh

      - name: Build instrumented provider
        shell: bash
        run: |
          cmake -S . -B build-coverage -DCMAKE_BUILD_TYPE=Debug \
            -DBEE2_PROVIDER_BUILD_TESTS=ON \
            -DBEE2_PROVIDER_ENABLE_COVERAGE=ON \
            -DOPENSSL_ROOT_DIR="$OPENSSL_PREFIX" \
            -DOPENSSL_INCLUDE_DIR="$OPENSSL_PREFIX/include" \
            -DOPENSSL_CRYPTO_LIBRARY="$OPENSSL_PREFIX/lib/libcrypto.so" \
            -DOPENSSL_SSL_LIBRARY="$OPENSSL_PREFIX/lib/libssl.so" \
            -DBEE2_OPENSSL_EXECUTABLE="$OPENSSL_PREFIX/bin/openssl"
          cmake --build build-coverage --parallel 4

      - name: Run all provider tests under coverage
        run: ctest --test-dir build-coverage --output-on-failure --timeout 180 --output-junit coverage-tests.xml

      - name: Report line and branch coverage
        shell: bash
        run: |
          python3 -m pip install --break-system-packages 'gcovr>=8,<9'
          python3 -m gcovr --root . --filter 'src/' --print-summary \
            --fail-under-function 100 --fail-under-line 80 --fail-under-branch 60 \
            --json-summary build-coverage/coverage-summary.json
          python3 -m gcovr --root . --filter 'src/' \
            --html-details build-coverage/coverage.html
          python3 -m gcovr --root . --filter 'src/' \
            --xml-pretty -o build-coverage/coverage.xml

      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: provider-source-coverage
          path: |
            build-coverage/coverage*
            build-coverage/coverage-tests.xml
          if-no-files-found: warn
